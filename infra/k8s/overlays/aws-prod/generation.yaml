# Agent-mode authoring: slots, and the authoring image loaded into this pod's dind from the
# tarball scripts/k8s_aws.py saves on each instance (the one hostPath, read-only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation
spec:
  template:
    spec:
      initContainers:
        # A native sidecar after dind: the worker starts once the image is loaded.
        - name: authoring-image
          image: docker:27.3.1-dind
          restartPolicy: Always
          env: [{name: DOCKER_HOST, value: unix:///var/run/dind/docker.sock}]
          envFrom: [{configMapRef: {name: sde-config}}]
          command:
            - sh
            - -c
            - |
              docker load -q -i /opt/sde/images/sde-authoring.tar || exit 1
              trap 'exit 0' TERM; sleep infinity & wait
          startupProbe:
            exec: {command: ["sh", "-c", "docker image inspect \"$SDE_AUTHORING_IMAGE\" >/dev/null"]}
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - {name: dind-sock, mountPath: /var/run/dind}
            - {name: images, mountPath: /opt/sde/images, readOnly: true}
      containers:
        - name: app
          env:
            - {name: SDE_AGENT_SLOTS, value: "2"}
            - {name: SDE_DOCKER_SLOTS, value: "3"}
      volumes:
        - name: images
          hostPath: {path: /opt/sde/images, type: Directory}
