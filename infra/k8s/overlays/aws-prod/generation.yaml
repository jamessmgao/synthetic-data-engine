# Agent-mode authoring: slots, and the authoring image loaded into this pod's dind from the
# tarball scripts/k8s_aws.py saves on each instance (the one hostPath, read-only).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation
spec:
  # Drain on deploy: new pods come up first (never fewer than `replicas` serving), and an old
  # one, on SIGTERM, stops claiming and lets its running sessions finish (SDE_DRAIN_ON_TERM_S,
  # 60 min) before it exits; at the deadline it hands what's left back (attempt refunded).
  # Old pods drain alongside the new ones, so memory and RDS connections rise for that hour.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 2, maxUnavailable: 0}
  template:
    spec:
      terminationGracePeriodSeconds: 3900  # the drain (3600 s) plus the release and exit
      containers:
        # 3 authoring sessions per pod (30 on 10 pods; the user's call, 2026-11-18, up from 2): sessions wait on the
        # model, so nodes ran at 4-8% CPU and 5.4-6 GB free with 1 each. The docker wrapper's label scope
        # keeps a stray kill inside its own job, and the DB pool stays per pod (RDS max 79).
        - name: app
          env:
            - {name: SDE_AGENT_SLOTS, value: "3"}
            - {name: SDE_DOCKER_SLOTS, value: "6"}
            # One role container at a time per session: 3 sessions x 2 parallel roles x 2 GB caps could
            # ask 12 GB of a 6 GiB dind, and an OOM inside dind reads as a failed self-check, not infra.
            - {name: SDE_TASK_PARALLEL, value: "1"}
            - {name: SDE_DRAIN_ON_TERM_S, value: "3600"}
          # Measured ~370-450 MiB with one session; a runaway is stopped, not the node.
          resources:
            requests: {memory: 512Mi}
            limits: {memory: 2Gi}
      initContainers:
        # The sandbox: the sessions' agent containers (55-130 MiB each now) and their self-check test
        # containers (up to 3 at a time, ≤2 GiB each, mostly far less). Measured 190-460 MiB idle.
        # dind is a native sidecar, so it lives in initContainers: under containers this merge made a
        # second, image-less "dind", and the API rejected the whole Deployment (deploy of 082166f).
        - name: dind
          resources:
            limits: {memory: 6Gi}  # the request (1Gi, cpu 500m) comes from overlays/aws/on-agents.yaml
      volumes:
        - name: images
          hostPath: {path: /opt/sde/images, type: Directory}
