# K3s on the AWS EC2 instances, for real runs: RDS Postgres, ElastiCache Redis and S3
# instead of the in-cluster data stores, live models (no mock), agent-mode authoring.
# Render with (authoring.env is written by the deploy; any value works for a check):
#
#   echo SDE_AUTHORING_IMAGE=x > infra/k8s/overlays/aws-prod/authoring.env
#   kubectl kustomize --load-restrictor LoadRestrictionsNone infra/k8s/overlays/aws-prod
#
# Secret sde-secrets is not generated here: scripts/k8s_aws.py creates it from SSM (keys
# DATABASE_URL, REDIS_URL, S3_BUCKET, OPENROUTER_API_KEY, OPENROUTER_API_BASE, SDE_API_KEY,
# SDE_BUDGET_USD). S3 uses the instances' IAM role through IMDS (hop limit 2), so no keys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sde
resources:
  - ../../base
  - public-tunnel.yaml
  - dashboard.yaml  # the dashboard (web/) and its own tunnel
  - spot-termination.yaml  # drains a Spot node on its 2-minute interruption notice
images:
  # Built and imported on every instance by scripts/k8s_aws.py, never pulled (the test
  # overlays get this tag from overlays/local; this one builds on the base directly).
  - {name: sde-pipeline, newName: sde-pipeline, newTag: local}
  - {name: sde-dashboard, newName: sde-dashboard, newTag: local}  # built on the server only
configMapGenerator:
  # Replaces the base's deploy/local.env (a dev file): code defaults for everything else.
  - name: sde-config
    behavior: replace
    options:
      labels: {app.kubernetes.io/name: sde-config}  # `deploy --only` applies it with the pipeline pods
    # SDE_AUTHORING_IMAGE=sde-authoring:<hash>, written by scripts/k8s_aws.py (gitignored).
    envs: [authoring.env]
    literals:
      - SDE_MOCK_LLM=0
      - SDE_AUTHOR_MODE=agent
      - SDE_AUTHORING_REASONING_EFFORT=medium  # as round 2 (tune-r3); unset = the provider default
      # One authoring model call at most 600 s, then terminus-2 retries it (litellm's default is
      # 6000 s). Iteration 1's worlds lost 10-32 min each to stalled calls (one: 1214 s for 310
      # tokens); the longest real step tonight was ~19k tokens in ~8 min. Authoring only: the
      # solver's calls are untouched.
      - SDE_AUTHORING_LLM_TIMEOUT_S=600
      # World jobs (world, retries, mutations) think longer: difficulty is designed there (the user's
      # call, iteration 2). High reasoning makes steps longer, so their call cap is 1200 s.
      - SDE_WORLD_REASONING_EFFORT=high
      - SDE_WORLD_LLM_TIMEOUT_S=1200
      - SDE_DB_POOL_MAX=2
      - SDE_WORK_DIR=/opt/sde/work
      # validate / world_check adopt the author's stamped sde-task / sde-world results
      # (shared/contracts/config.py adopt_author_checks) instead of re-running them in Docker.
      - SDE_ADOPT_AUTHOR_CHECKS=1
      - AWS_DEFAULT_REGION=us-east-2
replicas:
  # One per node across 17 (the spread), 3 authoring sessions each (generation.yaml): 51.
  # Needs the 17 runners joined and RDS db.t4g.medium (micro's ~80 connections fit only 10).
  - {name: generation, count: 11}  # 33 authoring sessions (3 each): authoring is model-bound, ~1.3 GB a pod, little CPU
  - {name: validate, count: 4}  # the user's call, 2026-11-18: more validation concurrency
  # executor: KEDA, 1-10 in production (the base's ScaledObject says 1-4; patched below).
patches:
  # No in-cluster data stores.
  - target: {kind: StatefulSet, name: "postgres|redis|s3"}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: any}
  - target: {kind: Service, name: "postgres|redis|s3"}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: any}
  # The aws overlay's placement and image pulls.
  # Only the Deployments with an `app` container (public-tunnel has none: the patch added an
  # image-less one there, and the API rejected public-tunnel on every deploy).
  - path: ../aws/no-pull.yaml
    target: {kind: Deployment, name: "api|control|validate|executor|generation"}
  - path: ../aws/no-pull-bootstrap.yaml
    target: {kind: Job, name: bootstrap}
  - path: ../aws/on-server.yaml
    target: {kind: Deployment, name: "api|control"}
  - path: ../aws/on-agents.yaml
    target: {kind: Deployment, name: "validate|executor|generation"}
  # validate stays off Spot nodes (labelled sde/lifecycle=spot by `k8s_aws.py join`; unlabelled
  # nodes match). api, control, the tunnels and the dashboard are on the K3s server already.
  # generation and executor may run anywhere: a reclaimed node's jobs are re-claimed.
  - target: {kind: Deployment, name: validate}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: any}
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - {key: sde/lifecycle, operator: NotIn, values: [spot]}
  # Batches the dashboard and reports count as dev whatever they cost (api/service.py
  # dev_batches), besides the mock runs (cost 0). The api's own env, not sde-config, so a change
  # here restarts only the api: `make aws-k8s-deploy OVERLAY=aws-prod ONLY=api`.
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: any}
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - {name: SDE_DEV_BATCHES, value: "revival-1,aws-b1"}
  # Docker slots per pod.
  - target: {kind: Deployment, name: validate}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SDE_DOCKER_SLOTS, value: "3"}}
  - target: {kind: Deployment, name: executor}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SDE_DOCKER_SLOTS, value: "2"}}
      # Agent runs start through the docker socket, outside the pod, so without a request the
      # scheduler can't see their CPU: executors piled onto some nodes (100%, load 4-6) while
      # others idled (13-30%) and 10 runs queued (2026-11-18 22:45). The request is what's left
      # after generation's 1-CPU requests (1.0-1.5 of ~1.9 vCPU already requested per node, so
      # 1800m fit nowhere): it keeps executors off the fullest nodes; the claim's CPU guard
      # (SDE_MAX_CPU_LOAD_PCT) does the rest.
  # Drain on SIGTERM, like generation: a deploy or a KEDA scale-in lets running agent runs finish
  # (up to 3700 s: the 3600 s agent timeout plus the verifier) instead of re-running each from
  # scratch; a Spot interruption still hands them back at once (evaluation/executor.py on_signal).
  # New pods come up first; draining pods claim nothing, and the claim's CPU guard keeps new pods
  # from overloading a node while old runs finish.
  - target: {kind: Deployment, name: executor}
    patch: |-
      - {op: add, path: /spec/template/spec/containers/0/env/-, value: {name: SDE_DRAIN_ON_TERM_S, value: "3700"}}
      - {op: replace, path: /spec/template/spec/terminationGracePeriodSeconds, value: 3800}
      - {op: add, path: /spec/strategy, value: {type: RollingUpdate, rollingUpdate: {maxSurge: 2, maxUnavailable: 0}}}
      - {op: add, path: /spec/template/spec/containers/0/resources, value: {requests: {cpu: 500m, memory: 1Gi}}}
      # dind's request 400m, not on-agents.yaml's 500m: app 500m + dind 500m = 1000m was 10m more than
      # any node had free (the emptiest had 1010m requested), so the executor roll stalled with 2 surge
      # pods Pending (2026-11-18 23:22-23:33, "0/17 nodes: Insufficient cpu"). 900m fits.
      - {op: replace, path: /spec/template/spec/initContainers/0/resources/requests/cpu, value: 400m}
  - target: {kind: ScaledObject, name: executor}
    patch: |-
      - {op: replace, path: /spec/maxReplicaCount, value: 16}  # 2 agent runs a pod: up to 32 runs on the 17 nodes
      - {op: replace, path: /spec/minReplicaCount, value: 2}
      # Scale down only after 15 min of a short queue (base: 2 min), longer than a rollout:
      # a scale-down deletes a pod without knowing it's mid-rollout, and batch aws-agent-b1
      # lost several in-flight rollouts that way (one dead-lettered after three).
      - {op: replace, path: /spec/advanced/horizontalPodAutoscalerConfig/behavior/scaleDown/stabilizationWindowSeconds, value: 900}
  # Spread generation pods evenly over the nodes (soft: never blocks scheduling). Two authoring
  # sessions' self-checks on one 2-vCPU node pushed its load to 4-8 (batch aws-agent-b1).
  - target: {kind: Deployment, name: generation}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app.kubernetes.io/name: generation}}
  # Spread executor pods too, as KEDA adds them: each runs up to 4 rollouts' builds and
  # verifiers, and stacking them on one node would starve its neighbours.
  - target: {kind: Deployment, name: executor}
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector: {matchLabels: {app.kubernetes.io/name: executor}}
  - path: generation.yaml
  - path: authoring-image.yaml
    target: {kind: Deployment, name: generation}
