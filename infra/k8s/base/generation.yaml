# Generation Service (create + revise queues). Docker from the dind sidecar, for agent-mode
# authoring trials (oneshot mode doesn't use it).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation
  labels: {app.kubernetes.io/name: generation}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: generation}
  template:
    metadata:
      labels: {app.kubernetes.io/name: generation}
    spec:
      containers:
        - name: app
          image: sde-pipeline
          command: ["python", "-m", "generator.service", "generation"]
          envFrom:
            - configMapRef: {name: sde-config}
            - secretRef: {name: sde-secrets}
