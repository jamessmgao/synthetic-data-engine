# Executor: the five rollouts per version (the run queue). Docker from the dind sidecar.
# Replicas are KEDA's (keda.yaml, 1-4), so none are set here: an apply would reset them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels: {app.kubernetes.io/name: executor}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: executor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: executor}
    spec:
      # On SIGTERM the executor releases its leases (KEDA's scale-down relies on it).
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: sde-pipeline
          command: ["python", "-m", "evaluation.executor"]
          envFrom:
            - configMapRef: {name: sde-config}
            - secretRef: {name: sde-secrets}
