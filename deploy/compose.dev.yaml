# Local stack with the production backends: Postgres, single-node Redis, and an
# S3-compatible object store (RustFS; MinIO no longer publishes public images).
# Run from the repo root (see the Makefile):
#
#   make deps-up        only Postgres + Redis + S3 (run workers/tests on the host)
#   make up             the whole stack, workers included
#   make test-infra     the infrastructure tests against these backends
#
# Commands per process (override via env; the defaults assume every branch is merged):
#   SDE_GENERATION_CMD    Generation Service (create + revise queues) + the one reconciler
#   SDE_TRACE_PARSER_CMD  Trace Parser service (analyze queue: accept / revise / reject)
#   SDE_VALIDATE_CMD      Build + Validate (shared/jobs/worker.py → task-builder gates)
#   SDE_EXECUTOR_CMD      Executor (the run queue)
#   SDE_API_CMD           the API service
#   SDE_RUNNER_GENERATION_CMD  Generation Service on worker-runner (agent mode only)
# Set one to "" to leave that process out.
#
# Author mode (docs/AUTHORING.md): SDE_AUTHOR_MODE=oneshot (default)
# drafts with one GLM-5.1 call on worker-control. With SDE_AUTHOR_MODE=agent every
# world / create / revise job is a Harbor authoring trial that needs Docker and holds
# a slot, so the Generation Service moves to worker-runner: `make up-agent` sets that up and
# builds the authoring image (SDE_AUTHORING_IMAGE) first.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://sde:sde@postgres:5432/sde
  REDIS_URL: redis://redis:6379/0
  S3_BUCKET: sde-artifacts
  S3_ENDPOINT_URL: http://s3:9000
  AWS_ACCESS_KEY_ID: sde-dev
  AWS_SECRET_ACCESS_KEY: sde-dev-secret
  AWS_DEFAULT_REGION: us-east-1
  # Harbor and Docker need the work dir at the same path in the container and on
  # the host, because task containers are started by the host's Docker daemon.
  SDE_WORK_DIR: ${PWD}/work

# Every setting (budget cap, slots, author mode, concurrency, guards, mock mode...)
# goes in deploy/local.env (optional, gitignored; see local.env.example), which every
# app service reads, like prod's runtime.env: a setting can't be silently left out.
# make.env is what `make up` / `make up-agent` chose; local.env, read last, wins. No
# `environment:` entry may set one of them: compose lets it beat both files.
x-local-env: &local-env
  - path: make.env
    required: false
  - path: local.env
    required: false

x-depends: &depends
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  s3: {condition: service_healthy}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: sde
      POSTGRES_PASSWORD: sde
      POSTGRES_DB: sde
    ports: ["${SDE_PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sde"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${SDE_REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Local stand-in for S3. Console at http://localhost:9001 (sde-dev / sde-dev-secret).
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: sde-dev
      RUSTFS_SECRET_KEY: sde-dev-secret
    ports: ["${SDE_S3_PORT:-9000}:9000", "${SDE_S3_CONSOLE_PORT:-9001}:9001"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      retries: 60

  api:
    profiles: [app]
    build: {context: .., dockerfile: deploy/Dockerfile, target: control}
    command: ["python", "-m", "shared.jobs.supervise", "${SDE_API_CMD-python -m api --host 0.0.0.0 --port 8000}"]
    env_file: *local-env
    environment:
      <<: *backend-env
      SDE_API_KEY: ${SDE_API_KEY:-dev-token}
      SDE_WORK_DIR: /tmp/sde-work # no work-dir mount here: a private cache for S3 reads
    ports: ["${SDE_API_PORT:-8000}:8000"]
    depends_on: *depends
    restart: unless-stopped

  # ×1: Generation Service + Trace Parser + the one reconciler.
  worker-control:
    profiles: [app]
    build: {context: .., dockerfile: deploy/Dockerfile, target: control}
    command:
      - python
      - -m
      - shared.jobs.supervise
      - ${SDE_GENERATION_CMD-python -m generator.service generation --with-reconciler}
      - ${SDE_TRACE_PARSER_CMD-python -m evaluation.trace_parser_service}
    env_file: *local-env
    environment:
      <<: *backend-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-}
    volumes: ["${PWD}/work:${PWD}/work", "${PWD}/output:/app/output"]
    depends_on: *depends
    restart: unless-stopped

  # ×N: Docker jobs (build + validate, rollouts). Scale with --scale worker-runner=N;
  # SDE_DOCKER_SLOTS caps concurrent Docker jobs across all copies.
  worker-runner:
    profiles: [app]
    build: {context: .., dockerfile: deploy/Dockerfile, target: runner}
    command:
      - python
      - -m
      - shared.jobs.supervise
      - ${SDE_VALIDATE_CMD-python -m validator.service validate}
      - ${SDE_EXECUTOR_CMD-python -m evaluation.executor}
      - ${SDE_RUNNER_GENERATION_CMD-}
    env_file: *local-env
    environment:
      <<: *backend-env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${PWD}/work:${PWD}/work"
    depends_on: *depends
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  s3data:
