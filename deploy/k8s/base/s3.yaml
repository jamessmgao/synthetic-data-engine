# Object storage: RustFS, S3-compatible (compose.dev's s3). Pods reach it at http://s3:9000.
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app.kubernetes.io/name: s3}
  ports: [{name: s3, port: 9000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  labels: {app.kubernetes.io/name: s3}
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: s3}
  template:
    metadata:
      labels: {app.kubernetes.io/name: s3}
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: sde-secrets, key: AWS_ACCESS_KEY_ID}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: sde-secrets, key: AWS_SECRET_ACCESS_KEY}}
          readinessProbe:
            tcpSocket: {port: 9000}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
