# AWS Node Termination Handler, IMDS mode: one pod per Spot node (sde/lifecycle=spot, set by
# `k8s_aws.py join`). On the 2-minute Spot interruption notice (or a scheduled maintenance
# event) it cordons and drains the node, so the workers get SIGTERM and hand their jobs back
# at once with the attempt refunded (shared/jobs/worker.py release_in_flight), instead of the
# leases lapsing after 10-30 min and each claim counting toward the 3-attempt dead-letter.
# IMDS is reachable from pods (hop limit 2). Pulled from public ECR, pinned.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spot-termination
  labels: {app.kubernetes.io/name: spot-termination}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sde-spot-termination
  labels: {app.kubernetes.io/name: spot-termination}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sde-spot-termination
  labels: {app.kubernetes.io/name: spot-termination}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sde-spot-termination
subjects:
  - {kind: ServiceAccount, name: spot-termination, namespace: sde}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spot-termination
  labels: {app.kubernetes.io/name: spot-termination}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: spot-termination}
  template:
    metadata:
      labels: {app.kubernetes.io/name: spot-termination}
    spec:
      serviceAccountName: spot-termination
      nodeSelector: {sde/lifecycle: spot}
      priorityClassName: system-node-critical
      containers:
        - name: handler
          image: public.ecr.aws/aws-ec2/aws-node-termination-handler:v1.25.2
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: ENABLE_SPOT_INTERRUPTION_DRAINING, value: "true"}
            - {name: ENABLE_SCHEDULED_EVENT_DRAINING, value: "true"}
            - {name: ENABLE_REBALANCE_MONITORING, value: "false"}
            # 90 s, not the pods' own: generation's is 3900 s (its deploy drain), and the instance
            # goes ~120 s after the notice. Its worker sees the notice in IMDS and hands its
            # jobs back at once (shared/jobs/worker.py Shutdown); executor / validate do anyway.
            - {name: POD_TERMINATION_GRACE_PERIOD, value: "90"}
            - {name: NODE_TERMINATION_GRACE_PERIOD, value: "110"}
            - {name: IGNORE_DAEMON_SETS, value: "true"}
            - {name: DELETE_LOCAL_DATA, value: "true"}  # the workers' emptyDirs (dind, work)
            # A stopped Spot runner comes back with its K3s agent: let it take pods again.
            - {name: UNCORDON_ON_REBOOT, value: "true"}
            - {name: JSON_LOGGING, value: "true"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
