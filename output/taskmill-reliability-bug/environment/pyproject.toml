[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmill"
version = "0.3.1"
description = "Reliable background job processor"
requires-python = ">=3.11"

[project.scripts]
taskmill = "taskmill.cli:main"

[tool.setuptools.packages.find]
include = ["taskmill*"]
